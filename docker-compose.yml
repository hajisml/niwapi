services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: niwapi
      POSTGRES_USER: niwapi
      POSTGRES_PASSWORD: niwapi
    ports:
      - "5432:5432"
    volumes:
      - niwapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niwapi -d niwapi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  niwapi_pgdata:
